    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#070D1E] text-slate-100 antialiased min-h-screen selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script>
      // Tratamento preventivo de WebSocket e erros de conexão assíncrona (evita Unhandled Rejection e erros não tratados)
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = '';
        if (typeof reason === 'string') {
          msg = reason;
        } else if (reason && typeof reason === 'object') {
          msg = reason.message || reason.stack || String(reason);
        }
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('websocket') !== -1 ||
          msg.indexOf('closed without opened') !== -1 ||
          msg.indexOf('failed to connect to websocket') !== -1
        ) {
          event.preventDefault();
          event.stopPropagation();
          return false;
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        if (
          typeof msg === 'string' &&
          (msg.indexOf('WebSocket') !== -1 ||
           msg.indexOf('websocket') !== -1 ||
           msg.indexOf('closed without opened') !== -1 ||
           msg.indexOf('failed to connect to websocket') !== -1)
        ) {
          event.preventDefault();
          event.stopPropagation();
          return true;
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
